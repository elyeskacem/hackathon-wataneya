<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- PLACEHOLDER backdrop: a 1970s football stadium at night. Replace with the real scene when it exists. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050b1c"/>
      <stop offset="1" stop-color="#1b2f5a"/>
    </linearGradient>
    <linearGradient id="pitch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6b38"/>
      <stop offset="1" stop-color="#143a1d"/>
    </linearGradient>
    <radialGradient id="flood" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffbe6" stop-opacity="1"/>
      <stop offset="0.25" stop-color="#fff0b8" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#fff0b8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#fff0b8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff0b8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="200" cy="80" r="2"/><circle cx="420" cy="140" r="1.6"/><circle cx="700" cy="60" r="2"/>
    <circle cx="980" cy="110" r="1.6"/><circle cx="1180" cy="50" r="2"/><circle cx="1500" cy="130" r="2"/>
    <circle cx="90" cy="200" r="1.5"/><circle cx="1330" cy="210" r="1.5"/>
  </g>
  <!-- light beams -->
  <g>
    <polygon points="170,150 270,150 560,560 60,560" fill="url(#beam)"/>
    <polygon points="1330,150 1430,150 1540,560 1040,560" fill="url(#beam)"/>
  </g>
  <!-- stands -->
  <path d="M0 470 L0 380 L400 330 L1200 330 L1600 380 L1600 470 Z" fill="#0b1226"/>
  <path d="M0 520 L0 430 L400 385 L1200 385 L1600 430 L1600 520 Z" fill="#141c36"/>
  <!-- crowd lights -->
  <g fill="#ffd98a" opacity="0.65">
    <circle cx="120" cy="415" r="2"/><circle cx="210" cy="445" r="2"/><circle cx="330" cy="405" r="2"/>
    <circle cx="470" cy="440" r="2"/><circle cx="590" cy="410" r="2"/><circle cx="720" cy="450" r="2"/>
    <circle cx="860" cy="412" r="2"/><circle cx="980" cy="446" r="2"/><circle cx="1100" cy="408" r="2"/>
    <circle cx="1230" cy="442" r="2"/><circle cx="1350" cy="412" r="2"/><circle cx="1470" cy="448" r="2"/>
    <circle cx="260" cy="480" r="2"/><circle cx="640" cy="486" r="2"/><circle cx="1040" cy="484" r="2"/><circle cx="1400" cy="480" r="2"/>
  </g>
  <!-- floodlight towers -->
  <g fill="#0a0f1f">
    <rect x="212" y="170" width="16" height="320"/>
    <rect x="1372" y="170" width="16" height="320"/>
  </g>
  <g>
    <circle cx="220" cy="150" r="90" fill="url(#flood)"/>
    <circle cx="1380" cy="150" r="90" fill="url(#flood)"/>
    <rect x="170" y="130" width="100" height="40" rx="6" fill="#fff6d0"/>
    <rect x="1330" y="130" width="100" height="40" rx="6" fill="#fff6d0"/>
  </g>
  <!-- pitch -->
  <path d="M0 520 L1600 520 L1600 900 L0 900 Z" fill="url(#pitch)"/>
  <g stroke="#e8f2e0" stroke-width="5" fill="none" opacity="0.85">
    <path d="M140 880 L520 540 L1080 540 L1460 880 Z"/>
    <path d="M800 540 L800 880"/>
    <ellipse cx="800" cy="710" rx="130" ry="58"/>
    <path d="M560 540 L500 600 L1100 600 L1040 540"/>
  </g>
  <!-- goal -->
  <g stroke="#f4f4f4" stroke-width="6" fill="none">
    <path d="M730 540 L730 500 L870 500 L870 540"/>
  </g>
  <!-- ball -->
  <circle cx="800" cy="710" r="12" fill="#f4f4f4" stroke="#222" stroke-width="2"/>
  <!-- placeholder label -->
  <g>
    <rect x="40" y="40" width="330" height="64" rx="12" fill="#e30613"/>
    <text x="205" y="85" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" letter-spacing="4" fill="#ffffff">PLACEHOLDER</text>
  </g>
</svg>
